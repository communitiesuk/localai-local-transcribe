services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: .env
    environment:
      - POSTGRES_HOST=db
      - STORAGE_SERVICE_NAME=local
      - LOCAL_STORAGE_PATH=/static
      - ELASTICMQ_URL=http://elasticmq:9324

    depends_on:
      db:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./.data
        target: /static
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/healthcheck"]
      interval: 60s
      retries: 3
      start_period: 30s
      timeout: 5s
    develop:
      watch:
        - path: ./backend
          target: /app/backend
          action: sync+restart
        - path: ./common
          target: /app/common
          action: sync+restart
        - path: ./poetry.lock
          action: rebuild

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    shm_size: 4gb
    deploy: # Make sure the worker has a couple of CPUS
      resources:
        limits:
          cpus: "2.0" # Set CPU limit to 2 cores
    env_file:
      - .env
    ports:
      - "8265:8265"
    volumes:
      - type: bind
        source: ./.data
        target: /static
    tmpfs:
      - /tmp
    environment:
      - POSTGRES_HOST=db
      - RAY_DASHBOARD_HOST=0.0.0.0
      - ELASTICMQ_URL=http://elasticmq:9324 
      - STORAGE_SERVICE_NAME=local
      - LOCAL_STORAGE_PATH=/static
      - RAY_OBJECT_STORE_ALLOW_SLOW_STORAGE=1
    stop_grace_period: 10s
    depends_on:
      db:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python worker/healthcheck.py"]
      interval: 60s
      retries: 3
      start_period: 60s
      timeout: 5s
    develop:
      watch:
        - path: ./worker
          target: /app/worker
          action: sync+restart
        - path: ./common
          target: /app/common
          action: sync+restart
        - path: ./poetry.lock
          action: rebuild

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
      args:
        - NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN
        - NEXT_PUBLIC_POSTHOG_API_KEY=$POSTHOG_API_KEY
    ports:
      - "3000:8081"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    environment:
      - BACKEND_HOST=http://backend:8080
      - NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN
      - NEXT_PUBLIC_POSTHOG_API_KEY=$POSTHOG_API_KEY
    volumes:
      - ./frontend:/app # Maps your Mac folder to the container (Hot Reloading)
      - ./common:/common # Maps common folder to the container
      - /app/node_modules # Protects container libraries
      - next_data:/app/.next # Keeps build speed fast
    develop:
      watch:
        - path: ./frontend
          target: /app
          action: sync
          ignore:
            - node_modules/
            - .next/
        - path: ./frontend/package.json
          action: rebuild

  db:
    image: postgres:13
    user: postgres
    env_file:
      - .env
    volumes:
      - local_postgres_data:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "minute_db"]
      interval: 5s
      timeout: 30s
      retries: 24
      start_period: 30s
      
  elasticmq:
    image: softwaremill/elasticmq
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9324/?Action=ListQueues"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  local_postgres_data: {}
  next_data: {}
  ollama_data: {}
