# Standard summarisation smoke test reading from / writing to blob storage.
run:
  eval_type: standard
  output_dir: evals/summarisation/output  # local fallback when blob.enabled is false
  seed: 0
  split: test
  limit: 2
  prompt_version: dev

dataset:
  name: synthetic-dialogues
  source: blob
  blob_path: summarisation/standard/dialogues.jsonl
  dialogue_field: dialogue
  reference_summary_field: summary

judge:
  pass_threshold: 4

metrics:
  - accuracy
  - coverage
  - readability

prompts:
  judge_template_path: evals/summarisation/prompts/judge.j2

blob:
  enabled: true
  # account_url falls back to AZURE_EVALS_STORAGE_ACCOUNT_URL when omitted.
  input_container: input
  debug_container: debug
  results_container: output
  output_prefix: summarisation
