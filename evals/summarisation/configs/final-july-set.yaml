# Standard summarisation eval over the generated July transcript set.
# Reads every transcript JSON in run.input_dir (symlinked to
# evals/dataset_generation/transcription_generation/output/final_july_set).
run:
  eval_type: standard
  input_dir: evals/summarisation/input/final_july_set
  output_dir: evals/summarisation/output
  seed: 0
  # No limit: the whole set is evaluated.
  prompt_version: dev
  dataset_version: final_july_set

dataset:
  name: final_july_set
  source: local_dir

judge:
  pass_threshold: 4

metrics:
  - accuracy
  - numerical_accuracy
  - template_fit
  - coverage
  - action_clarity
  - professional_tone
  - readability
  - auditability

prompts:
  summarizer_template_name: General
  judge_template_path: evals/summarisation/prompts/judge.j2
