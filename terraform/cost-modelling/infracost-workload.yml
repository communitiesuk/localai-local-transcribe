defaults:
  meetings_per_active_user: 50
  mean_audio_minutes: 60
  transcriptions_per_meeting: 1
  summaries_per_meeting: 1

scenarios:
  idle: {monthly_active_users: 0}
  low: {monthly_active_users: 1000}
  medium: {monthly_active_users: 1200}
  high: {monthly_active_users: 1500, alb_active_connections: 20}

assumptions:
  source_mb_per_90_minutes: 80
  converted_audio_kbps: 192
  audio_retention_days: 30
  background_egress_gb: 4
  free_egress_gb: 100
  background_nat_gb: 5
  other_nat_gb_per_meeting: 0.002
  additional_management_events: 1717635
  https_requests_per_meeting: 50
  status_requests_per_transcription: 450
  viewer_gb_per_meeting: 0.025
  origin_gb_per_meeting: 0.001
  alb_new_connections_per_meeting: 0.00002
  alb_active_connections: 10
  s3_writes_per_meeting: 2
  s3_reads_per_meeting: 3
  queue_request_size_kb: 16
  sqs_requests_per_transcription: 20
  sqs_requests_per_summary: 10
  logs_endpoint_gb_per_meeting: 0.004
  ecr_endpoint_gb: 12
  ecr_storage_gb: {frontend: 3, backend: 5, worker: 8}
  # Storage GB per meeting, monthly PUTs, and additional PUTs per meeting.
  s3_logs:
    module.uploads_bucket.module.uploads_bucket.aws_s3_bucket.log_bucket: [0.00024, 720, 0]
    module.frontdoor.aws_s3_bucket.cloudfront_logs: [0.006, 4320, 0]
    module.frontdoor.module.alb_logs.aws_s3_bucket.main: [0.002, 4320, 0]
    module.monitoring.module.s3_bucket.aws_s3_bucket.main: [0.001, 0, 2]
  # Driver and GB per unit of that driver: stored, ingested, scanned.
  cloudwatch_logs:
    module.ecs.module.frontend_log_group.aws_cloudwatch_log_group.main: [meetings, 0.0024, 0.0002, 0.0002]
    module.ecs.module.backend_log_group.aws_cloudwatch_log_group.main: [meetings, 0.0072, 0.0006, 0.0002]
    module.ecs.module.worker_log_group.aws_cloudwatch_log_group.main: [jobs, 0.0096, 0.0008, 0.0002]
    module.frontdoor.aws_cloudwatch_log_group.main: [meetings, 0.0018, 0.0006, 0.0002]
    module.monitoring.module.ecs_events_log_group.aws_cloudwatch_log_group.main: [meetings, 0.000004, 0.0001, 0]
    module.monitoring.module.cloudtrail_cloudwatch_group.aws_cloudwatch_log_group.main: [meetings, 0.0006, 0.0002, 0]
    module.networking.module.vpc_flow_logs_accepted.aws_cloudwatch_log_group.main: [meetings, 0.0012, 0.0004, 0]
    module.networking.module.vpc_flow_logs_rejected.aws_cloudwatch_log_group.main: [meetings, 0.0003, 0.0001, 0]
    module.bastion.module.bastion_logs.aws_cloudwatch_log_group.main: [meetings, 0.0006, 0.0002, 0]

