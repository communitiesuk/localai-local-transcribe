# Summarisation Evals smoke test.
# Reads input from / writes output to blob; Entra ID auth via the AzureCLI@2 service connection.

name: Summarisation Evals

trigger: none
pr: none

variables:
  - group: evals-pipeline-config
  - template: ../templates/evals-variable-defaults.yml

schedules:
  # Runs weekly at 21:00 UTC on Sundays; fortnightly cadence is enforced by the gate job.
  - cron: '0 21 * * Sun'
    displayName: 'Fortnightly Sunday 21:00 UTC'
    branches:
      include:
        - development
    always: true

parameters:
  - name: config
    displayName: 'Eval config'
    type: string
    default: 'evals/summarisation/configs/blob-smoke-test.yaml'
  - name: resultsArtifactName
    displayName: 'Short-retention non-sensitive results artifact name'
    type: string
    default: 'summarisation-eval-results'

jobs:
  - template: ../templates/fortnightly-schedule-gate-job.yml
    parameters:
      scheduledRunsEnabled: $(EVALS_SCHEDULED_RUNS_ENABLED_RESOLVED)
      referenceSunday: $(EVALS_FORTNIGHTLY_START_SUNDAY_RESOLVED)

  - job: summarisation_smoke_test
    displayName: 'Summarisation eval smoke test'
    dependsOn: fortnightly_schedule_gate
    condition: and(succeeded(), eq(dependencies.fortnightly_schedule_gate.outputs['set_schedule_gate.shouldRun'], 'true'))
    timeoutInMinutes: 60
    pool:
      vmImage: ubuntu-latest
    steps:
      - template: ../templates/run-eval-steps.yml
        parameters:
          pythonVersion: $(EVALS_PYTHON_VERSION_RESOLVED)
          poetryVersion: $(EVALS_POETRY_VERSION_RESOLVED)
          poetryDependencyGroup: evals-summarisation
          evalModule: evals.summarisation.src.main
          azureServiceConnection: $(EVALS_AZURE_SERVICE_CONNECTION)
          config: ${{ parameters.config }}
          resultsArtifactName: ${{ parameters.resultsArtifactName }}
          runDisplayName: 'Run summarisation smoke test (blob)'
