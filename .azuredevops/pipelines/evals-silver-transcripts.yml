# Silver transcript generation from Azure Blob Storage — manual-run only.

name: Silver Transcript Generation

trigger: none
pr: none

variables:
  - group: evals-pipeline-config
  - template: ../templates/evals-variable-defaults.yml
  - name: SILVER_INPUT_DIR
    value: '$(Build.SourcesDirectory)/evals/dataset_generation/silver_transcripts/input/azure'
  - name: SILVER_OUTPUT_DIR
    value: '$(Build.ArtifactStagingDirectory)/silver-transcripts-output'
  - name: SILVER_CONFIG_PATH
    value: '$(Build.SourcesDirectory)/evals/dataset_generation/silver_transcripts/configs/azure-devops.generated.yaml'

parameters:
  - name: inputPrefix
    displayName: 'Input folder/prefix in eval input container'
    type: string
    default: 'transcription/'

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - template: ../templates/setup-python-poetry.yml
    parameters:
      pythonVersion: $(EVALS_PYTHON_VERSION_RESOLVED)
      poetryVersion: $(EVALS_POETRY_VERSION_RESOLVED)

  - script: poetry sync --no-root --no-ansi --with evals-transcription,evals-dataset-generation
    displayName: 'Install dependencies'

  - task: AzureCLI@2
    displayName: 'Download and run silver transcript generator'
    inputs:
      azureSubscription: $(EVALS_AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        mkdir -p "$(SILVER_OUTPUT_DIR)"
        poetry run python -m evals.shared.blob_input \
          --destination "$(SILVER_INPUT_DIR)" \
          --prefix "${{ parameters.inputPrefix }}"
        cat > "$(SILVER_CONFIG_PATH)" <<EOF
        input_dir: $(SILVER_INPUT_DIR)
        work_dir: $(SILVER_OUTPUT_DIR)
        segment_duration_seconds: null
        EOF
        poetry run python -m evals.dataset_generation.silver_transcripts.src.main --config "$(SILVER_CONFIG_PATH)"
    env:
      ENVIRONMENT: test
      AZURE_EVALS_RESTRICTED_STORAGE_ACCOUNT_URL: $(AZURE_EVALS_SENSITIVE_STORAGE_ACCOUNT_URL)
      STORAGE_SERVICE_NAME: $(STORAGE_SERVICE_NAME)
      AZURE_BLOB_CONNECTION_STRING: $(AZURE_BLOB_CONNECTION_STRING)
      AZURE_UPLOADS_CONTAINER_NAME: $(AZURE_UPLOADS_CONTAINER_NAME)
      AZURE_TRANSCRIPTION_CONTAINER_NAME: $(AZURE_TRANSCRIPTION_CONTAINER_NAME)
      AZURE_APIM_URL: $(AZURE_APIM_URL)
      AZURE_APIM_API_VERSION: $(AZURE_APIM_API_VERSION)
      AZURE_APIM_SUBSCRIPTION_KEY: $(AZURE_APIM_SUBSCRIPTION_KEY)
      AZURE_APIM_AUTH_METHOD: $(AZURE_APIM_AUTH_METHOD)
      AZURE_APIM_TENANT_ID: $(AZURE_APIM_TENANT_ID)
      AZURE_APIM_CLIENT_ID: $(AZURE_APIM_CLIENT_ID)
      AZURE_APIM_CLIENT_SECRET: $(AZURE_APIM_CLIENT_SECRET)
      AZURE_APIM_SCOPE: $(AZURE_APIM_SCOPE)
      AZURE_APIM_ACCESS_TOKEN: $(AZURE_APIM_ACCESS_TOKEN)

  - script: mkdir -p "$(SILVER_OUTPUT_DIR)"
    displayName: 'Ensure artifact dir exists'
    condition: succeededOrFailed()

  - task: PublishPipelineArtifact@1
    displayName: 'Upload silver transcript drafts and segments'
    condition: succeededOrFailed()
    inputs:
      artifact: silver-transcripts-output
      targetPath: $(SILVER_OUTPUT_DIR)
      publishLocation: 'pipeline'
