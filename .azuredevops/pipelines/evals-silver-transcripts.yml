# Manual generation of reviewable silver transcript drafts.
name: Silver Transcript Generation

trigger: none
pr: none

variables:
  - group: evals-pipeline-config
  - template: ../templates/evals-variable-defaults.yml

parameters:
  - name: inputPrefix
    displayName: 'Input folder/prefix in eval input container'
    type: string
    # Matches evals/transcription/configs/blob-smoke-test.yaml: a small, access-verified
    # subfolder, rather than the whole transcription/ tree.
    default: 'transcription/smoke-test/audio'
  - name: cutoffSeconds
    displayName: 'Target segment duration in seconds'
    type: number
    default: 60

jobs:
  - job: silver_transcripts
    # This may need to be increased for long recordings or larger batches.
    timeoutInMinutes: 360
    # ado-vmss-latest replaces vmss-shared. The old pool is shut down at 17:00 on 28 October 2026.
    pool:
      name: ado-vmss-latest
    steps:
      - checkout: self

      - template: ../templates/setup-python-poetry.yml
        parameters:
          pythonVersion: $(EVALS_PYTHON_VERSION_RESOLVED)
          poetryVersion: $(EVALS_POETRY_VERSION_RESOLVED)
          freeDiskSpace: false

      - script: poetry sync --no-root --no-ansi --with evals-transcription,evals-dataset-generation
        displayName: 'Install dependencies'

      # Staging, generation and publishing to debug storage all happen in one process (main.py),
      # the same way evals.transcription.src.evaluate stages and publishes its own blob runs.
      - task: AzureCLI@2
        displayName: 'Run silver transcript generation (blob)'
        inputs:
          azureSubscription: $(EVALS_AZURE_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -eu
            config_path="$(Agent.TempDirectory)/silver-config-$(Build.BuildId).yaml"
            printf 'cutoff_seconds: %s\nblob:\n  enabled: true\n  input_prefix: "%s"\n  output_prefix: ""\n' \
              "$SILVER_CUTOFF_SECONDS" "$SILVER_INPUT_PREFIX" > "$config_path"
            poetry run python -c "import dotenv, runpy; dotenv.load_dotenv('.env.example', override=False); runpy.run_module('evals.dataset_generation.silver_transcripts.src.main', run_name='__main__')" \
              --config "$config_path"
        env:
          ENVIRONMENT: test
          SILVER_INPUT_PREFIX: ${{ parameters.inputPrefix }}
          SILVER_CUTOFF_SECONDS: ${{ parameters.cutoffSeconds }}
          AZURE_EVALS_RESTRICTED_STORAGE_ACCOUNT_URL: $(AZURE_EVALS_SENSITIVE_STORAGE_ACCOUNT_URL)
          AZURE_BLOB_CONNECTION_STRING: $(AZURE_BLOB_CONNECTION_STRING)
          AZURE_UPLOADS_CONTAINER_NAME: $(AZURE_UPLOADS_CONTAINER_NAME)
          AZURE_TRANSCRIPTION_CONTAINER_NAME: $(AZURE_TRANSCRIPTION_CONTAINER_NAME)
          AZURE_APIM_URL: $(AZURE_APIM_URL)
          AZURE_APIM_API_VERSION: $(AZURE_APIM_API_VERSION)
          AZURE_APIM_SUBSCRIPTION_KEY: $(AZURE_APIM_SUBSCRIPTION_KEY)
          AZURE_APIM_AUTH_METHOD: client_secret
          AZURE_APIM_TENANT_ID: $(AZURE_APIM_TENANT_ID)
          AZURE_APIM_CLIENT_ID: $(AZURE_APIM_CLIENT_ID)
          AZURE_APIM_CLIENT_SECRET: $(AZURE_APIM_CLIENT_SECRET)
          AZURE_APIM_SCOPE: $(AZURE_APIM_SCOPE)
