# Reusable steps template for running eval pipelines.

parameters:
  - name: pythonVersion
    type: string
    default: '3.14'
  - name: poetryVersion
    type: string
    default: '2.5.1'
  - name: poetryDependencyGroup
    type: string
    default: 'evals-summarisation'
  - name: evalModule
    type: string
    default: 'evals.summarisation.src.main'
  - name: azureServiceConnection
    type: string
  - name: config
    type: string
  - name: resultsArtifactName
    type: string
  - name: runDisplayName
    type: string

steps:
  - checkout: self

  - template: setup-python-poetry.yml
    parameters:
      pythonVersion: ${{ parameters.pythonVersion }}
      poetryVersion: ${{ parameters.poetryVersion }}

  - script: poetry sync --no-root --no-ansi --with ${{ parameters.poetryDependencyGroup }}
    displayName: 'Install dependencies'

  - task: AzureCLI@2
    displayName: ${{ parameters.runDisplayName }}
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        results_artifact_dir="$(Build.ArtifactStagingDirectory)/${{ parameters.resultsArtifactName }}"
        mkdir -p "${results_artifact_dir}"
        poetry run python -c "import dotenv, runpy; dotenv.load_dotenv('.env.example', override=False); runpy.run_module('${{ parameters.evalModule }}', run_name='__main__')" \
          --config ${{ parameters.config }} \
          --results-artifact-dir "${results_artifact_dir}"
    env:
      ENVIRONMENT: test
      # Blob endpoints of the evals storage accounts, set by the evals-pipeline-config variable group.
      AZURE_EVALS_RESTRICTED_STORAGE_ACCOUNT_URL: $(AZURE_EVALS_SENSITIVE_STORAGE_ACCOUNT_URL)
      AZURE_EVALS_SHARED_STORAGE_ACCOUNT_URL: $(AZURE_EVALS_RESULTS_STORAGE_ACCOUNT_URL)
      # These are set by the evals-pipeline-config variable group (secret variables must be mapped explicitly).
      # The pipelines sign in to the AI Gateway as their own service principal, so each run obtains
      # and refreshes its own token. Only the client secret is secret. The tenant id, client id and
      # scope are mapped too, because values left unmapped fall back to the placeholders in
      # .env.example, which is loaded by the command above.
      AZURE_APIM_AUTH_METHOD: client_secret
      AZURE_APIM_TENANT_ID: $(AZURE_APIM_TENANT_ID)
      AZURE_APIM_CLIENT_ID: $(AZURE_APIM_CLIENT_ID)
      AZURE_APIM_CLIENT_SECRET: $(AZURE_APIM_CLIENT_SECRET)
      AZURE_APIM_SCOPE: $(AZURE_APIM_SCOPE)
      AZURE_APIM_URL: $(AZURE_APIM_URL)
      AZURE_APIM_API_VERSION: $(AZURE_APIM_API_VERSION)
      AZURE_APIM_SUBSCRIPTION_KEY: $(AZURE_APIM_SUBSCRIPTION_KEY)

  # Azure DevOps retention is configured at run/pipeline level, not per artifact. Keep this
  # pipeline's run retention short; the artifact contains only summary.json, never debug files.
  - task: PublishPipelineArtifact@1
    displayName: 'Publish non-sensitive eval results artifact'
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.resultsArtifactName }}'
      artifact: ${{ parameters.resultsArtifactName }}
      publishLocation: 'pipeline'
