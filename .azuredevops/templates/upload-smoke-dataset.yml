# Requires checkout: self before this template.
steps:
  - task: AzureCLI@2
    displayName: Upload standard summarisation smoke-test dataset
    inputs:
      azureSubscription: $(EVALS_AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        if [[ "$STORAGE_URL" != https://* || "$STORAGE_URL" == *'$('* ]]; then
          echo "Set AZURE_EVALS_SENSITIVE_STORAGE_ACCOUNT_URL in evals-pipeline-config to the HTTPS blob endpoint." >&2
          exit 1
        fi

        source_file="${SOURCE_ROOT}/evals/summarisation/sample_data/standard/dialogues.jsonl"
        test -s "$source_file"
        exists=$(az storage blob exists \
          --auth-mode login \
          --account-name "${SENSITIVE_ACCOUNT}" \
          --container-name input \
          --name summarisation/standard/dialogues.jsonl \
          --query exists --output tsv --only-show-errors)
        case "$exists" in
          true)
            echo "Smoke-test dataset already exists; leaving it unchanged."
            exit 0
            ;;
          false) ;;
          *) echo "Unexpected blob existence response" >&2; exit 1 ;;
        esac

        az storage blob upload \
          --auth-mode login \
          --account-name "${SENSITIVE_ACCOUNT}" \
          --container-name input \
          --name summarisation/standard/dialogues.jsonl \
          --file "$source_file" \
          --overwrite false \
          --only-show-errors \
          --output none

        echo "Uploaded input/summarisation/standard/dialogues.jsonl. The summarisation smoke test can now read it."
    env:
      STORAGE_URL: $(AZURE_EVALS_SENSITIVE_STORAGE_ACCOUNT_URL)
      SOURCE_ROOT: $(Build.SourcesDirectory)
