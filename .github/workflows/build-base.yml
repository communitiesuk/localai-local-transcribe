name: Docker build validation

on:
  pull_request:
  push: 
    branches:
      - development

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, worker]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false


