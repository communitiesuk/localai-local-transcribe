name: frontend-tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Formatting
        working-directory: frontend
        run: npm run prettier:check

      - name: Generate OpenAPI client
        working-directory: frontend
        run: npm run generate-client

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests with coverage
        id: test
        working-directory: frontend
        run: |
          set -o pipefail
          npm run test:cov 2>&1 | tee test-output.txt

      - name: Upload frontend coverage HTML
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage-html
          path: frontend/coverage

      - name: Upload frontend coverage XML
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage-xml
          path: frontend/coverage/cobertura-coverage.xml

      - name: Coverage summary
        if: always()
        working-directory: frontend
        run: |
          echo "## Frontend Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed 's/\x1b\[[0-9;]*m//g' test-output.txt | sed -n '/^-.*|.*-$/,/^$/p' >> $GITHUB_STEP_SUMMARY || echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
