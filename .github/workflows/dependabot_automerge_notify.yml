name: Dependabot merge Slack notify

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Notify Slack
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WEBHOOK_DEV: ${{ secrets.SLACK_WEBHOOK_DEV }}
          WEBHOOK_STAGING: ${{ secrets.SLACK_WEBHOOK_STAGING }}
          WEBHOOK_PROD: ${{ secrets.SLACK_WEBHOOK_PROD }}
        run: |
          MESSAGE="Testing webhooks work - #${PR_NUMBER}."
          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')

          for webhook in "$WEBHOOK_DEV" "$WEBHOOK_STAGING" "$WEBHOOK_PROD"; do
            curl --fail -X POST -H 'Content-type: application/json' \
              --data "$PAYLOAD" \
              "$webhook"
          done
