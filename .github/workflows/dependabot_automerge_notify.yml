name: Dependabot merge Slack notify

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Slack
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WEBHOOK_DEV: ${{ secrets.SLACK_WEBHOOK_DEV }}
          WEBHOOK_STAGING: ${{ secrets.SLACK_WEBHOOK_STAGING }}
          WEBHOOK_PROD: ${{ secrets.SLACK_WEBHOOK_PROD }}
        run: |
          MESSAGE=":shield: Dependabot security fix merged in PR #${PR_NUMBER}. Redeploy required."
          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')

          for webhook in "$WEBHOOK_DEV" "$WEBHOOK_STAGING" "$WEBHOOK_PROD"; do
            curl --fail -X POST -H 'Content-type: application/json' \
              --data "$PAYLOAD" \
              "$webhook"
          done
