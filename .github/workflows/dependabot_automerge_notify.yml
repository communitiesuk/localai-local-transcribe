name: Dependabot merge Slack notify

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.DEPENDABOT_ALERTS_CONNECTOR_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_ALERTS_CONNECTOR_PRIVATE_KEY }}

      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          alert-lookup: true

      - name: Notify Slack
        if: steps.dependabot-metadata.outputs.ghsa-id != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WEBHOOK_DEV: ${{ secrets.SLACK_WEBHOOK_DEV }}
          WEBHOOK_STAGING: ${{ secrets.SLACK_WEBHOOK_STAGING }}
          WEBHOOK_PROD: ${{ secrets.SLACK_WEBHOOK_PROD }}
        run: |
          MESSAGE="Dependabot security fix merged in PR #${PR_NUMBER}. Redeploy required."
          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')

          for webhook in "$WEBHOOK_DEV" "$WEBHOOK_STAGING" "$WEBHOOK_PROD"; do
            curl --fail -X POST -H 'Content-type: application/json' \
              --data "$PAYLOAD" \
              "$webhook"
          done
