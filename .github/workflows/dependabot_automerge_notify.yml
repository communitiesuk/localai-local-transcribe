name: Dependabot merge Slack notify

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.DEPENDABOT_ALERTS_CONNECTOR_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_ALERTS_CONNECTOR_PRIVATE_KEY }}

      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          alert-lookup: true

      - name: Notify Slack
        if: steps.dependabot-metadata.outputs.ghsa-id != ''
        run: |
          MESSAGE="Dependabot security fix merged in PR #${{ github.event.pull_request.number }}. Redeploy required."

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_DEV }}

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_STAGING }}

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_PROD }}
