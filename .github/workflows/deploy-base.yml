name: deploy-base

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      aws-account-id:
        required: true
      alarm-email-address:
        required: true
      slack-webhook-url:
        required: true
      sentry-dsn:
        required: false
      sentry-security-report-uri:
        required: false
      sentry-auth-token:
        required: false
      plausible-domain:
        required: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VAR_ssl_certs_created: true
  TERRAFORM_VERSION : ~>1.14.0
  PYTHON_VERSION: 3.14

jobs:
  build:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        service: [frontend, backend, worker]
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.aws-account-id }}:role/${{ inputs.environment }}-push-image
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.aws-account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.aws-account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ inputs.environment }}-${{ matrix.service }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.sentry-dsn }}
            NEXT_PUBLIC_ENVIRONMENT=${{ inputs.environment }}
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ secrets.plausible-domain }}
            SENTRY_SECURITY_REPORT_URI=${{ secrets.sentry-security-report-uri }}
            CSP_STORAGE_ORIGIN=https://${{ inputs.environment }}-local-transcribe-uploads.s3.amazonaws.com
          secrets: |
            "sentry_auth_token=${{ secrets.sentry-auth-token }}"

      - name: Notify Slack on build failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
        if: failure()
        run: |
          PAYLOAD=$(jq -n \
            --arg environment "${{ inputs.environment }}" \
            --arg service "${{ matrix.service }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              text: (":x: *Build Failed* — " + $service),
              blocks: [
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*Environment:* " + $environment) },
                    { type: "mrkdwn", text: ("*Run:* <" + $run_url + "|View run>") }
                  ]
                }
              ]
            }')
          curl --fail-with-body -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

  plan:
    name: Terraform plan
    runs-on: ubuntu-26.04
    needs: build
    concurrency: tfstate-${{ inputs.environment }}
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    defaults:
      run:
        working-directory: terraform/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.aws-account-id }}:role/github-actions-terraform-ci-plan-read-only
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        env:
          TF_VAR_alarm_email_address: ${{ secrets.alarm-email-address }}

        run: terraform plan -input=false -lock=false -detailed-exitcode -var="image_tag=${{ github.sha }}"
        continue-on-error: true

      - name: Output plan exitcode
        run: |
          echo "=== PLAN EXITCODE ==="
          echo "Terraform plan exitcode: ${{ steps.plan.outputs.exitcode }}"

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == 1
        run: exit 1

  apply:
    name: Terraform apply
    runs-on: ubuntu-26.04
    needs: plan
    if: needs.plan.outputs.exitcode == 2
    concurrency: tfstate-${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.aws-account-id }}:role/github-actions-terraform-admin
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        env:
          TF_VAR_alarm_email_address: ${{ secrets.alarm-email-address }}
        run: terraform apply -auto-approve -input=false -var="image_tag=${{ github.sha }}"

  deploy-feature-flags:
    name: Deploy feature flags
    runs-on: ubuntu-26.04
    needs: [plan, apply]
    if: ${{!cancelled() && needs.plan.result == 'success'}}
    concurrency: tfstate-${{ inputs.environment }}
    outputs:
      status: ${{ steps.deploy.outputs.status }}
    defaults:
      run:
        working-directory: terraform/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.aws-account-id }}:role/github-actions-appconfig-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read Poetry version from pyproject.toml
        id: poetry-version
        working-directory: ${{ github.workspace }}
        run: |
          POETRY_VERSION=$(python scripts/get-poetry-version.py) || exit 1
          echo "version=${POETRY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: ${{ steps.poetry-version.outputs.version }}

      - name: Install deploy_feature_flags.py dependencies
        working-directory: ${{ github.workspace }}
        run: poetry install --no-root --no-ansi

      - name: Deploy feature flags to AppConfig
        id: deploy
        working-directory: scripts
        env:
          TF_DIR: ${{ github.workspace }}/terraform/${{ inputs.environment }}
        run: |
          set -euo pipefail

          APPLICATION_ID=$(terraform -chdir="$TF_DIR" output -raw app_config_application_id)
          ENVIRONMENT_ID=$(terraform -chdir="$TF_DIR" output -raw app_config_environment_id)
          CONFIGURATION_PROFILE_ID=$(terraform -chdir="$TF_DIR" output -raw app_config_configuration_profile_id)
          DEPLOYMENT_STRATEGY_ID=$(terraform -chdir="$TF_DIR" output -raw app_config_deployment_strategy_id)

          poetry run python -m deploy_feature_flags.main \
            --application-id "$APPLICATION_ID" \
            --environment-id "$ENVIRONMENT_ID" \
            --configuration-profile-id "$CONFIGURATION_PROFILE_ID" \
            --deployment-strategy-id "$DEPLOYMENT_STRATEGY_ID"

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-26.04
    needs: [build, plan, apply, deploy-feature-flags]
    if: always()
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [[ "${{ needs.plan.result }}" == "cancelled" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.plan.result }}" == "failure" ]]; then
            echo "status=plan failed" >> $GITHUB_OUTPUT
            echo "emoji=:x:" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.apply.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=:white_check_mark:" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.apply.result }}" == "skipped" && "${{ needs.plan.outputs.exitcode }}" == "0" ]]; then
            echo "status=no changes" >> $GITHUB_OUTPUT
            echo "emoji=:information_source:" >> $GITHUB_OUTPUT
          else
            echo "status=apply failed" >> $GITHUB_OUTPUT
            echo "emoji=:x:" >> $GITHUB_OUTPUT
          fi

          case "${{ needs.deploy-feature-flags.result }}" in
            skipped) echo "feature_flag_status=skipped" >> $GITHUB_OUTPUT ;;
            *)
              case "${{ needs.deploy-feature-flags.outputs.status }}" in
                updated) echo "feature_flag_status=updated" >> $GITHUB_OUTPUT ;;
                no_change) echo "feature_flag_status=no change" >> $GITHUB_OUTPUT ;;
                error) echo "feature_flag_status=error" >> $GITHUB_OUTPUT ;;
              esac
              ;;
          esac

      - name: Send Slack notification on deployment status
        if: steps.status.outputs.skip != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
        run: |
          PAYLOAD=$(jq -n \
            --arg text "${{ steps.status.outputs.emoji }} Deployment - ${{inputs.environment}}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg status "${{ steps.status.outputs.status }}" \
            --arg feature_flag_status "${{ steps.status.outputs.feature_flag_status }}" \
            '{
              text: $text,
              blocks: ([
                {
                  type: "section",
                  text: { type: "mrkdwn", text: $text }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*Status:* " + $status) },
                    { type: "mrkdwn", text: ("*Run:* <" + $run_url + "|View run>") }
                  ]
                }
              ] + (if $feature_flag_status != "" then [
                {
                  type: "section",
                  text: { type: "mrkdwn", text: ("*Feature Flag*\n*Status:* " + $feature_flag_status) }
                }
              ] else [] end))
            }')
          curl --fail-with-body -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
