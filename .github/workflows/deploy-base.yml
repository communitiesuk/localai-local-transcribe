name: deploy-base

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      aws-account-id:
        required: true
      alarm-email-address:
        required: true
      slack-webhook-url:
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VAR_ssl_certs_created: true

jobs:
  build:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        service: [frontend, backend, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.aws-account-id }}:role/${{ inputs.environment }}-push-image
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.aws-account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.aws-account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ inputs.environment }}-${{ matrix.service }}:${{ github.sha }}
      
      - name: Notify Slack on build failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
        if: failure()
        run: |
          PAYLOAD=$(jq -n \
            --arg environment "${{ inputs.environment }}" \
            --arg service "${{ matrix.service }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              text: (":x: *Build Failed* — " + $service),
              blocks: [
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*Environment:* " + $environment) },
                    { type: "mrkdwn", text: ("*Run:* <" + $run_url + "|View run>") }
                  ]
                }
              ]
            }')
          curl --fail-with-body -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: build
    concurrency: tfstate-${{ inputs.environment }}
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    defaults:
      run:
        working-directory: terraform/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.aws-account-id }}:role/github-actions-terraform-ci-plan-read-only
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~>1.14.0

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        env:
          TF_VAR_alarm_email_address: ${{ secrets.alarm-email-address }}

        run: terraform plan -input=false -lock=false -detailed-exitcode -var="image_tag=${{ github.sha }}"
        continue-on-error: true

      - name: Output plan exitcode
        run: |
          echo "=== PLAN EXITCODE ==="
          echo "Terraform plan exitcode: ${{ steps.plan.outputs.exitcode }}"

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == 1
        run: exit 1

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.exitcode == 2
    concurrency: tfstate-${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.aws-account-id }}:role/github-actions-terraform-admin
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~>1.14.0

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        env:
          TF_VAR_alarm_email_address: ${{ secrets.alarm-email-address }}
        run: terraform apply -auto-approve -input=false -var="image_tag=${{ github.sha }}"
   
  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [build, plan, apply]
    if: always()
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [[ "${{ needs.plan.result }}" == "cancelled" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.plan.result }}" == "failure" ]]; then
            echo "status=plan failed" >> $GITHUB_OUTPUT
            echo "emoji=:x:" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.apply.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=:white_check_mark:" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.apply.result }}" == "skipped" && "${{ needs.plan.outputs.exitcode }}" == "0" ]]; then
            echo "status=no changes" >> $GITHUB_OUTPUT
            echo "emoji=:information_source:" >> $GITHUB_OUTPUT
          else
            echo "status=apply failed" >> $GITHUB_OUTPUT
            echo "emoji=:x:" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification on deployment status
        if: steps.status.outputs.skip != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
        run: |
          PAYLOAD=$(jq -n \
            --arg text "${{ steps.status.outputs.emoji }} Deployment - ${{inputs.environment}}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg status "${{ steps.status.outputs.status }}" \
            '{
              text: $text,
              blocks: [
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*Status:* " + $status) },
                    { type: "mrkdwn", text: ("*Run:* <" + $run_url + "|View run>") }
                  ]
                }
              ]
            }')
          curl --fail-with-body -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
