name: type-check

env:
  PYTHON_VERSION: "3.12"

on:
  merge_group:

  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read Poetry version from pyproject.toml
        id: poetry-version
        run: |
          python <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import sys
          import tomllib

          constraint = tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["requires-poetry"]
          match = re.fullmatch(r"=([0-9]+(?:\.[0-9]+)*(?:[A-Za-z0-9.+-]*)?)", constraint)
          if not match:
              sys.exit(f'Poetry version must be pinned exactly in pyproject.toml, for example requires-poetry = "=2.5.1"; got {constraint!r}')

          print(f"version={match.group(1)}")
          PY

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: ${{ steps.poetry-version.outputs.version }}

      - name: Install dependencies
        run: |
          poetry install --no-root --no-ansi --with dev

      - name: Run mypy
        run: |
          poetry run mypy .

      - name: Format and linting
        run: |
          poetry run ruff format . --check
          poetry run ruff check .
