# Put action within a raw block so that the curly bracket expressions aren't picked up by the cookiecutter
#
name: type-check

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.3.3"

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python and Poetry
        uses: ./.github/actions/python-poetry-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: |
          poetry install --no-root --no-ansi --with dev

      - name: Run mypy
        run: |
          poetry run mypy .

      - name: Format and linting
        run: |
          poetry run ruff format . --check
          poetry run ruff check .
