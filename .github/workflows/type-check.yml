name: type-check

env:
  PYTHON_VERSION: "3.14"

on:
  merge_group:

  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read Poetry version from pyproject.toml
        id: poetry-version
        run: |
          POETRY_VERSION=$(python scripts/get-poetry-version.py) || exit 1
          echo "version=${POETRY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: ${{ steps.poetry-version.outputs.version }}

      - name: Install dependencies
        run: |
          poetry install --no-root --no-ansi --with dev

      - name: Run mypy
        run: |
          poetry run mypy .

      - name: Format and linting
        run: |
          poetry run ruff format . --check
          poetry run ruff check .
