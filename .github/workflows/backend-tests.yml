name: Backend Tests

on:
  workflow_call:
    inputs: 
      python_version: 
        required: true
        type: string
      poetry_version: 
        required: true
        type: string
  push:
    branches:
      - feat/AIILG-493-ci-cache 

env:
  ENVIRONMENT: test
  USE_ELASTICMQ: true

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: release

    steps:
     

      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Copy env file
        run: cp .env.example .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ '3.12' }}

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: ${{  '2.3.3' }}

      - name: Check Poetry version
        run: |
          which poetry
          poetry --version

      - name: Configure Poetry to create .venv in project
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv 
        uses: actions/cache@v4 
        with: 
          path: .venv 
          key: venv-${{ runner.os }}-${{  '3.12'}}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{  '3.12'}}-
            venv-${{ runner.os }}-
      
      - name: Install dependencies
        run: poetry install --no-root --no-ansi --with dev 


      - name: Create test data directory
        run: mkdir -p .data/test_audio/normal

      - name: Start services
        run: docker compose up -d db elasticmq --wait

      - name: Run database migrations
        run: poetry run alembic upgrade head

      - name: Run tests with coverage
        run: make test-cov

      - name: Upload backend coverage HTML 
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: htmlcov/cov

      - name: Upload backend coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-xml
          path: coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          poetry run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

      - name: Stop services
        if: always()
        run: docker compose down
