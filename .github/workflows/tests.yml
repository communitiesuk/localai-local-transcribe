name: tests

env:
  DOCKER_BUILDKIT: 1

on:
  merge_group:

  push:
    paths:
      - backend/**
      - Makefile
      - frontend/**
      - .github/workflows/*.yml
      - .github/workflows/*.yaml

    branches:
      - "main"
      - "feature/**"
      - "chore/**"
      - "bugfix/**"
      - "hotfix/**"
      - "development/**"
      - "dependabot/**"
      - "security/**"
      - "staging"
      - "production"

  pull_request:
    branches:
      - development
      - staging
      - production

  workflow_dispatch:

jobs:
  poetry_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.poetry-version.outputs.version }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Read Poetry version from pyproject.toml
        id: poetry-version
        run: |
          POETRY_VERSION=$(python scripts/get-poetry-version.py) || exit 1
          echo "version=${POETRY_VERSION}" >> "$GITHUB_OUTPUT"

  backend_tests:
    needs: poetry_version
    uses: ./.github/workflows/backend-tests.yml
    with:
      python_version: "3.14"
      poetry_version: ${{ needs.poetry_version.outputs.version }}
    secrets: inherit

  frontend_tests:
    uses: ./.github/workflows/frontend-tests.yml
    secrets: inherit
