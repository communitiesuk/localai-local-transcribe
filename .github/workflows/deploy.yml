name: deploy

on:
  push:
    branches:
      - development
      - feat/AIILG-199-deployment-pipelines

jobs:
  deploy-development:
    uses: ./.github/workflows/deploy-base.yml
    with:
      environment: development
      aws-account-id: ${{ secrets.DEV_AWS_ACCOUNT_ID }}
      alarm-email-address: ${{ secrets.DEV_ALARM_EMAIL_ADDRESS }}
    secrets: inherit
