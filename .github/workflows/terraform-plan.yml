name: terraform-plan

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      aws-account-id:
        required: true
      alarm-email-address:
        required: true

env:
  AWS_REGION: eu-west-2
  TERRAFORM_VERSION: ~>1.14.0

jobs:
  terraform-plan:
    name: Terraform Plan — ${{ inputs.environment }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.aws-account-id }}:role/github-actions-terraform-ci-plan-read-only
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        env:
          TF_VAR_alarm_email_address: ${{ secrets.alarm-email-address }}
        run: terraform plan -no-color -input=false -out=tfplan -lock=false -var="image_tag=${{ github.sha }}"

      - name: Terraform show
        run: terraform show -no-color tfplan > tf_plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-${{ inputs.environment }}
          path: terraform/${{ inputs.environment }}/tfplan

      - name: Upload readable plan
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-text-${{ inputs.environment }}
          path: terraform/${{ inputs.environment }}/tf_plan.txt

      - name: Publish plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`terraform/${process.env.ENVIRONMENT}/tf_plan.txt`, 'utf8');
            const header = `## Terraform Plan — ${process.env.ENVIRONMENT}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const existing = comments.find(c => c.body.startsWith(header));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: `${header}\n\`\`\`\n${plan}\n\`\`\``,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `${header}\n\`\`\`\n${plan}\n\`\`\``,
              });
            }
