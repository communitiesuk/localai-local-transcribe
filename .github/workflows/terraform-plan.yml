name: terraform-plan

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github-environment:
        description: >-
          GitHub environment to run the plan in. Staging and production use one with required
          reviewers. Leave empty to run without an environment.
        required: false
        type: string
        default: ""
    secrets:
      aws-account-id:
        required: true
      alarm-email-address:
        required: true

env:
  AWS_REGION: eu-west-2
  TERRAFORM_VERSION: ~>1.14.0

jobs:
  terraform-plan:
    name: Terraform Plan — ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    environment: ${{ inputs.github-environment }}
    defaults:
      run:
        working-directory: terraform/${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Must stay before the AWS credentials step, so that a workflow which could publish
      # the saved plan is stopped before it can read anything.
      - name: Check no workflow publishes a saved plan
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_terraform_plan_not_published.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.aws-account-id }}:role/github-actions-terraform-ci-plan-read-only
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      # Note this `tfplan` file contains secrets, do not upload it anywhere!
      # It is written outside the repository folder so that uploading a folder cannot include it.
      # scripts/check_terraform_plan_not_published.py fails the build if it is used anywhere else.
      - name: Terraform plan
        env:
          TF_VAR_alarm_email_address: ${{ secrets.alarm-email-address }}
        run: terraform plan -no-color -input=false -out="$RUNNER_TEMP/tfplan" -lock=false -var="image_tag=${{ github.sha }}"

      # terraform show will redact 'sensitive' values automatically as long as
      # the `-json` option is not used see:
      # https://developer.hashicorp.com/terraform/cli/commands/show
      - name: Terraform show
        run: terraform show -no-color "$RUNNER_TEMP/tfplan" > tf_plan.txt

      - name: Upload readable plan
        uses: actions/upload-artifact@v7
        with:
          name: tf-plan-text-${{ inputs.environment }}
          path: terraform/${{ inputs.environment }}/tf_plan.txt

      - name: Publish plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`terraform/${process.env.ENVIRONMENT}/tf_plan.txt`, 'utf8');
            const header = `## Terraform Plan — ${process.env.ENVIRONMENT}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const existing = comments.find(c => c.body.startsWith(header));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: `${header}\n\`\`\`\n${plan}\n\`\`\``,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `${header}\n\`\`\`\n${plan}\n\`\`\``,
              });
            }
