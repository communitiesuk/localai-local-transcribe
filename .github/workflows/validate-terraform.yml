name: validate-terraform

on:
  merge_group:

  pull_request:
  push:
    branches: [development, staging, production]

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-development:
    uses: ./.github/workflows/terraform-validate.yml
    with:
      environment: development
 
  validate-staging:
    uses: ./.github/workflows/terraform-validate.yml
    with:
      environment: staging

  validate-production:
    uses: ./.github/workflows/terraform-validate.yml
    with:
      environment: production

  plan-development:
    if: github.base_ref == 'development'
    needs: validate-development
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: development
    secrets:
      aws-account-id: ${{ secrets.DEV_AWS_ACCOUNT_ID }}
      alarm-email-address: ${{ secrets.DEV_ALARM_EMAIL_ADDRESS }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  plan-staging:
    if: github.base_ref == 'staging'
    needs: validate-staging
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: staging
    secrets:
      aws-account-id: ${{ secrets.STAGING_AWS_ACCOUNT_ID }}
      alarm-email-address: ${{ secrets.STAGING_ALARM_EMAIL_ADDRESS }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  plan-production:
    if: github.base_ref == 'production'
    needs: validate-production
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: production
    secrets:
      aws-account-id: ${{ secrets.PROD_AWS_ACCOUNT_ID }}
      alarm-email-address: ${{ secrets.PROD_ALARM_EMAIL_ADDRESS }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write